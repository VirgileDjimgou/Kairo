name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  flutter:
    name: Flutter — Android and Web foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version that authored the golden files. An unpinned
          # "stable" channel silently upgraded the engine and broke every
          # pixel golden in CI while local runs stayed green.
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Install Flutter packages
        working-directory: apps/flutter_kairo
        run: flutter pub get
      - name: Analyze Flutter client
        working-directory: apps/flutter_kairo
        run: flutter analyze
      - name: Verify Flutter formatting
        working-directory: apps/flutter_kairo
        run: dart format --set-exit-if-changed lib test
      - name: Test Flutter client
        working-directory: apps/flutter_kairo
        run: flutter test
      - name: Build Flutter web
        working-directory: apps/flutter_kairo
        run: flutter build web --dart-define=KAIRO_FLAVOR=production --dart-define=KAIRO_API_BASE_URL=https://app.combissportverein.org/api/v1
      - name: Build Android debug APK
        working-directory: apps/flutter_kairo
        run: flutter build apk --debug --dart-define=KAIRO_FLAVOR=production --dart-define=KAIRO_API_BASE_URL=https://app.combissportverein.org/api/v1

  security:
    name: Security — Secret And Sensitive File Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reject databases, backups, and sensitive data exports
        run: node scripts/check-sensitive-files.mjs

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API — Quality Baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Lint all backend modules (ruff)
        run: >
          python -m ruff check
          services/api/app/
          services/api/tests/
          --ignore E501

      - name: Type check all backend modules (mypy)
        run: >
          python -m mypy --config-file services/api/pyproject.toml --explicit-package-bases
          services/api/app/

      - name: Run backend tests from repository root
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          APP_ENV: test
        run: python -m pytest services/api/tests -q

  contracts:
    name: Contracts — OpenAPI And Generated Clients
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect breaking OpenAPI changes
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          APP_ENV: test
        run: node scripts/check-openapi-contract.mjs

      - name: Verify generated client contracts are current
        run: node scripts/generate-client-contracts.mjs --check

      - name: Verify client calls map to documented operations
        run: node scripts/check-client-route-coverage.mjs

  web:
    name: Web — Type, Build, And Browser Baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Type check
        run: |
          cd apps/web
          npm run type-check

      - name: Guard canonical API collection paths
        run: node scripts/check-api-collection-paths.mjs

      - name: Guard FR/EN/DE catalog parity
        run: node scripts/check-i18n-parity.mjs

      - name: Guard capability fallback bundles
        run: node scripts/check-capability-bundles.mjs

      - name: Report potential hardcoded user-facing strings
        run: node scripts/check-i18n-coverage.mjs

      - name: Build
        run: |
          cd apps/web
          npm run build

      - name: Install Playwright browser
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Run localization browser regression pack
        run: |
          cd apps/web
          npm run test:e2e:locale

      # Each browser pack runs even when an earlier pack fails so that a
      # regression is never hidden behind skipped downstream steps. Any failing
      # step still fails the job.
      - name: Run role authorization browser matrix
        if: success() || failure()
        run: |
          cd apps/web
          npm run test:e2e:roles

      - name: Run release candidate browser matrix
        if: success() || failure()
        run: |
          cd apps/web
          npm run test:e2e:release-candidate

      - name: Run accessibility audit pack
        if: success() || failure()
        run: |
          cd apps/web
          npm run test:e2e:a11y
