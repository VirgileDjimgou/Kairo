# Cloud/core deployment. It deliberately contains no Ollama or Qdrant service.
# Run with: docker compose --env-file .env.core -f docker-compose.core.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]

  api:
    build:
      context: ./services/api
      target: production
    env_file: ["${CORE_ENV_FILE:-.env.core}"]
    expose: ["8000"]
    volumes:
      - ./backups:/var/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
      target: production
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: ["${CORE_ENV_FILE:-.env.core}"]
    volumes:
      - ./backups:/var/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped

  scheduler:
    build:
      context: ./services/api
      target: production
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: ["${CORE_ENV_FILE:-.env.core}"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    expose: ["80"]
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web]
    profiles: [tunnel]
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_wal_archive:
  redis_data:
  minio_data:
