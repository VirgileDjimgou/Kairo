# Production override for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# This override:
#   - Switches web and api to production targets
#   - Removes volume mounts (source is baked into images)
#   - Runs api with 2 uvicorn workers
#   - Disables debug/docs endpoints
#   - Sets production JWT_SECRET_KEY (change this for your deployment)

services:
  web:
    build:
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
    ports: !reset []
    volumes: !reset []
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_DEBUG=false
      - VITE_API_BASE_URL=/api/v1
    restart: unless-stopped

  api:
    build:
      target: production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - JWT_SECRET_KEY=VPiLJSFr8liy9u4ueAKA7FCB76WxV5LfhuVzUDZv7ypxXP8qOrsbw6jgwVIf+kCNzODpnvbpJQza8t5J7dLegQ==
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped

  worker:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - JWT_SECRET_KEY=VPiLJSFr8liy9u4ueAKA7FCB76WxV5LfhuVzUDZv7ypxXP8qOrsbw6jgwVIf+kCNzODpnvbpJQza8t5J7dLegQ==

  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  qdrant:
    ports: !reset []
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped

  ollama:
    ports: !reset []
    restart: unless-stopped

  cloudflared:
    restart: unless-stopped
