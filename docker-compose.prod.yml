# Production override for docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# This override:
#   - Switches web and api to production targets
#   - Removes volume mounts (source is baked into images)
#   - Runs api with 2 uvicorn workers
#   - Disables debug/docs endpoints
#   - Requires JWT_SECRET_KEY from the operator environment (never committed)
#
# Security note: JWT_SECRET_KEY must be generated per deployment
# (for example: openssl rand -base64 48) and injected via the environment.
# Compose fails closed when the variable is missing.

services:
  web:
    build:
      target: production
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    ports: !reset []
    volumes: !reset []
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - APP_DEBUG=false
      - VITE_API_BASE_URL=/api/v1
    restart: unless-stopped

  api:
    build:
      target: production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in the operator environment}
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped

  worker:
    build:
      target: production
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in the operator environment}

  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  qdrant:
    ports: !reset []
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped

  ollama:
    ports: !reset []
    restart: unless-stopped

  cloudflared:
    restart: unless-stopped
